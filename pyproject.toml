[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-memory-service"
version = "0.1.0"
description = "Tenant-isolated vector memory for multi-client AI pipelines: one Qdrant collection, server-side tenant filters, plus an anonymized global layout-pattern tier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Micole Kurt T. Gonda", email = "ico.webdev@gmail.com" }]
keywords = ["rag", "qdrant", "multitenancy", "vector-database", "fastapi", "embeddings"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "qdrant-client>=1.11",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tms-keygen = "tenant_memory.keys:main"

[project.urls]
Homepage = "https://github.com/MicoleKurt/tenant-memory-service"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
